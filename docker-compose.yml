version: '3.8'

services:
  web:
    build: .
    image: php74-app
    container_name: gold-manager
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      PHP_ERROR_REPORTING: E_ALL & ~E_DEPRECATED & ~E_STRICT
    network_mode: "bridge"
    extra_hosts:
      - "host.docker.internal:host-gateway"